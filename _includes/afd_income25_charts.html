{% comment %} Charts for /afd-income-2025/: styles, data and Plotly code. The text lives in _pages/afd-income-2025.md. {% endcomment %}
<style>
.ltw-article figure.ltw-plotly { padding: 14px 6px 10px 6px; }
.ltw-article .afdinc-chart { width: 100%; }
.ltw-article .afdinc-chart .js-plotly-plot { cursor: default; }
.ltw-article .afdinc-titel { font-weight: 700; font-size: 1.02em; line-height: 1.35; color: #1f1f1f; margin: 4px 6px 10px 6px; text-align: left; }
.ltw-article figure.ltw-plotly figcaption { text-align: justify; hyphens: auto; font-size: 0.76em; line-height: 1.5; color: #666; margin: 8px 6px 0 6px; }
.ltw-article figure.ltw-plotly figcaption i { color: #444; }
@media (max-width: 700px) { .ltw-article .ltw-hero-title br { display: none; } }
</style>

{% include afd_income25_data.html %}

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var D = window.AFDINC25;
  var schrift = "Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif";
  var farben = { "CDU/CSU": "#2b2b2b", "AfD": "#009ee0", "SPD": "#d71f1d", "Greens": "#3f8f2f", "Left": "#b8236d",
                 "BSW": "#7a2a55", "FDP": "#e5c300", "Other": "#a0a0a0" };
  var cfg = { displayModeBar: false, responsive: true };
  /* narrow screens: facet grids collapse to one column and the chart boxes grow */
  var schmal = window.innerWidth < 640;
  function hoehe(id, h) { if (schmal) document.getElementById(id).style.height = h + "px"; }
  function wrap(s, n) { var w = s.split(" "), out = [], z = ""; w.forEach(function (x) { if ((z + " " + x).trim().length > n) { out.push(z.trim()); z = x; } else z += " " + x; }); out.push(z.trim()); return out.join("<br>"); }
  var ink = "#1f1f1f", ink2 = "#5a5a5a", ink3 = "#8a8a8a";
  function f1(x, d) { return Number(x).toFixed(d === undefined ? 1 : d); }
  function vz(x, d) { var s = f1(Math.abs(x), d); return (x > 0 ? "+" : x < 0 ? "−" : "") + s; }
  function tsd(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function hexAlpha(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }
  /* readable hover box: dark background, white text, larger font */
  var hover = { bgcolor: "#1f1f1f", bordercolor: "#1f1f1f", font: { family: schrift, size: 14, color: "#ffffff" }, align: "left" };
  var basis = { font: { family: schrift, color: ink, size: 13 }, paper_bgcolor: "white", plot_bgcolor: "white", hoverlabel: hover, hovermode: "closest" };
  function strip(ax, text, sub) {
    return { xref: ax.x + " domain", yref: ax.y + " domain", x: 0, y: 1.02, yanchor: "bottom", xanchor: "left", showarrow: false, align: "left",
             text: "<b>" + text + "</b>" + (sub ? "<br><i>" + sub + "</i>" : ""), font: { size: 12.5, color: ink },
             bgcolor: "#e6e6e6", borderpad: 5, width: 0 };
  }
  function gridAxes(n) {
    var axes = [];
    for (var i = 0; i < n; i++) { var s = i === 0 ? "" : String(i + 1); axes.push({ x: "x" + s, y: "y" + s, xaxis: "xaxis" + s, yaxis: "yaxis" + s }); }
    return axes;
  }
  /* percent axis with explicit tick labels (ticksuffix is ignored when tickvals are set) */
  function pAxis(bis, schritt, extra) {
    var tv = []; for (var v = 0; v <= bis + 1e-9; v += schritt) tv.push(v);
    return Object.assign({ range: [0, bis], tickvals: tv, ticktext: tv.map(function (v) { return v + "%"; }), gridcolor: "#e6e6e6", zeroline: false, fixedrange: true, tickfont: { size: 10.5, color: ink2 } }, extra || {});
  }
  /* percentage-point axis for differences */
  function ppAxis(von, bis, schritt, extra) {
    var tv = []; for (var v = von; v <= bis + 1e-9; v += schritt) tv.push(v);
    return Object.assign({ range: [von, bis], tickvals: tv, ticktext: tv.map(function (v) { return v === 0 ? "0" : vz(v, 0); }), gridcolor: "#eeeeee", zeroline: false, fixedrange: true, tickfont: { size: 10.5, color: ink2 } }, extra || {});
  }
  var E = D.income;
  var xInc = { fixedrange: true, tickfont: { size: schmal ? 9.5 : 11 }, tickangle: schmal ? -45 : 0, showgrid: false };

  /* confidence band + line + points for one series on one pair of axes */
  function band(x, ci, farbe, ax, name, legende, hoverText) {
    var a = ax || { x: "x", y: "y" };
    return [
      { type: "scatter", mode: "lines", x: x, y: ci.lo, xaxis: a.x, yaxis: a.y, line: { width: 0 }, hoverinfo: "skip", showlegend: false },
      { type: "scatter", mode: "lines", x: x, y: ci.hi, xaxis: a.x, yaxis: a.y, line: { width: 0 }, fill: "tonexty", fillcolor: hexAlpha(farbe, 0.16), hoverinfo: "skip", showlegend: false },
      { type: "scatter", mode: "lines+markers", x: x, y: ci.est, xaxis: a.x, yaxis: a.y, name: name, showlegend: !!legende, legendgroup: name,
        line: { color: farbe, width: 3 }, marker: { size: 10, color: "white", line: { color: farbe, width: 2.5 } },
        customdata: ci.est.map(function (v, i) { return [f1(v), f1(ci.lo[i]), f1(ci.hi[i])]; }),
        hovertemplate: (hoverText || "") + "<b>%{customdata[0]}%</b><br><span style='font-size:11px'>95% CI: %{customdata[1]} to %{customdata[2]}%</span><extra></extra>" }
    ];
  }

  /* ---------- 1) AfD share by income ---------- */
  Plotly.newPlot("afdinc-bar", [{
    type: "bar", x: E, y: D.afd_bar.share, marker: { color: farben.AfD }, width: 0.68,
    text: D.afd_bar.share.map(function (v) { return f1(v) + "%"; }), textposition: "outside", cliponaxis: false, textfont: { size: 12, color: ink },
    customdata: D.afd_bar.share.map(function (v, i) { return [f1(v), tsd(D.afd_bar.n[i]), D.afd_bar.n_afd[i]]; }),
    hovertemplate: "<b>%{x}</b><br>AfD: %{customdata[0]}%<br><span style='font-size:11px'>n = %{customdata[1]}, of whom AfD %{customdata[2]}</span><extra></extra>"
  }], Object.assign({}, basis, {
    xaxis: xInc, yaxis: pAxis(25, 5),
    margin: { l: 50, r: 15, t: 20, b: schmal ? 90 : 50 }
  }), cfg);

  /* ---------- 2) East / West ---------- */
  (function () {
    var reg = [["East Germany", "#a6192e", "solid"], ["West Germany", "#1f3864", "solid"], ["Total", "#8a8a8a", "dot"]];
    var traces = reg.map(function (r) {
      var d = D.eastwest[r[0]];
      return { type: "scatter", mode: "lines+markers", name: r[0], x: E, y: d.share,
        line: { color: r[1], width: 3, dash: r[2] }, marker: { size: 9, color: r[1] },
        customdata: d.share.map(function (v, i) { return [f1(v), tsd(d.n[i])]; }),
        hovertemplate: "<b>" + r[0] + "</b><br>%{x}: %{customdata[0]}%<br><span style='font-size:11px'>n = %{customdata[1]}</span><extra></extra>" };
    });
    Plotly.newPlot("afdinc-eastwest", traces, Object.assign({}, basis, {
      xaxis: xInc, yaxis: pAxis(35, 5),
      legend: { orientation: "h", x: 0, y: 1.02, xanchor: "left", yanchor: "bottom", font: { size: 12 } },
      margin: { l: 50, r: 15, t: 40, b: schmal ? 90 : 50 }
    }), cfg);
  })();

  /* ---------- 3) predicted AfD share: bivariate vs. with controls ---------- */
  (function () {
    var axes = gridAxes(2), traces = [], annos = [], shapes = [], lay = {};
    var titel = ["Without controls", "With controls"], daten = [D.pred_afd.bivariate, D.pred_afd.controls];
    var sub = ["income only", "age, sex, education, household size, East/West"];
    var n = E.length, xp = n - 1 + 0.5;
    hoehe("afdinc-pred", 820);
    daten.forEach(function (ci, k) {
      var ax = axes[k], von = ci.est[0], bis = ci.est[n - 1];
      traces = traces.concat(band(E, ci, farben.AfD, ax, "AfD", false, "%{x}<br>"));
      annos.push(strip(ax, titel[k], schmal ? sub[k] : wrap(sub[k], 40)));
      /* gap between the lowest and the highest income group: dotted reference line, arrow and label in pp */
      shapes.push({ type: "line", xref: ax.x, yref: ax.y, x0: 0, x1: xp, y0: von, y1: von, line: { color: ink3, width: 1, dash: "dot" } });
      annos.push({ xref: ax.x, yref: ax.y, axref: ax.x, ayref: ax.y, x: xp, y: bis, ax: xp, ay: von, text: "", showarrow: true,
                   arrowhead: 2, arrowsize: 1, arrowwidth: 1.6, arrowcolor: ink });
      annos.push({ xref: ax.x, yref: ax.y, x: xp, y: (von + bis) / 2, xanchor: "left", xshift: 5, showarrow: false, align: "left",
                   text: "<b>" + vz(bis - von) + " pp</b>", font: { size: 13, color: ink } });
      lay[ax.xaxis] = Object.assign({}, xInc, { tickangle: -45, tickfont: { size: 10 }, range: [-0.5, n + 0.9] });
      lay[ax.yaxis] = pAxis(25, 5, { showticklabels: schmal || k === 0 });
    });
    Plotly.newPlot("afdinc-pred", traces, Object.assign({}, basis, lay, {
      annotations: annos, shapes: shapes,
      grid: { rows: schmal ? 2 : 1, columns: schmal ? 1 : 2, pattern: "independent", roworder: "top to bottom", xgap: 0.08, ygap: 0.35 },
      margin: { l: 50, r: 15, t: 65, b: 95 }
    }), cfg);
  })();

  /* ---------- 4) AfD: low income vs. comparison groups, without and with controls ---------- */
  (function () {
    var L = D.contrast_labels, rows = L.map(function (l, i) { return -i; });
    var serien = [["without controls", D.contrast_afd.bivariate, "#a8a8a8", 0.16], ["with controls", D.contrast_afd.controls, farben.AfD, -0.16]];
    var traces = serien.map(function (s) {
      var c = s[1];
      return { type: "scatter", mode: "markers", name: s[0], x: c.est, y: rows.map(function (r) { return r + s[3]; }),
        marker: { size: 12, color: "white", line: { color: s[2], width: 2.5 } },
        error_x: { type: "data", symmetric: false, array: c.hi.map(function (h, i) { return h - c.est[i]; }), arrayminus: c.lo.map(function (l, i) { return c.est[i] - l; }), color: s[2], thickness: 2.2, width: 5 },
        customdata: c.est.map(function (v, i) { return [vz(v), vz(c.lo[i]), vz(c.hi[i]), f1(c.p[i], 3), L[i]]; }),
        hovertemplate: "<b>%{customdata[4]}</b><br>" + s[0] + ": %{customdata[0]} pp<br><span style='font-size:11px'>95% CI: %{customdata[1]} to %{customdata[2]} · p = %{customdata[3]}</span><extra></extra>" };
    });
    hoehe("afdinc-contrast", 480);
    Plotly.newPlot("afdinc-contrast", traces, Object.assign({}, basis, {
      xaxis: ppAxis(-10, 20, 5, { title: { text: "Difference in percentage points", font: { size: 12, color: ink2 } } }),
      yaxis: { tickvals: rows, ticktext: L.map(function (l) { return wrap(l, schmal ? 14 : 22); }), range: [-L.length + 0.4, 0.6], showgrid: false, zeroline: false, fixedrange: true, tickfont: { size: 12 }, automargin: true },
      shapes: [{ type: "line", xref: "x", yref: "paper", x0: 0, x1: 0, y0: 0, y1: 1, line: { color: ink3, width: 1, dash: "dot" } }],
      legend: { orientation: "h", x: 0, y: 1.02, xanchor: "left", yanchor: "bottom", font: { size: 12 } },
      margin: { l: 10, r: 15, t: 40, b: 55 }
    }), cfg);
  })();

  /* ---------- 5) second vote by income, all parties ---------- */
  (function () {
    var stapel = ["CDU/CSU", "SPD", "Greens", "FDP", "Left", "AfD", "BSW", "Other"];
    var traces = stapel.map(function (p) {
      var v = D.vote_by_income[p];
      return { type: "bar", name: p, x: E, y: v, marker: { color: farben[p], line: { color: "white", width: 1 } },
        text: v.map(function (x) { return x >= 7 ? String(Math.round(x)) : ""; }), textposition: "inside", insidetextanchor: "middle",
        textfont: { size: 10.5, color: p === "FDP" || p === "Other" ? ink : "white" },
        customdata: v.map(function (x) { return f1(x); }),
        hovertemplate: "<b>%{x}</b><br>" + p + ": %{customdata}%<extra></extra>" };
    });
    Plotly.newPlot("afdinc-parties", traces, Object.assign({}, basis, {
      barmode: "stack", bargap: 0.25,
      xaxis: xInc, yaxis: pAxis(100, 25),
      legend: { orientation: "h", x: 0, y: 1.02, xanchor: "left", yanchor: "bottom", font: { size: 12 }, traceorder: "normal" },
      margin: { l: 50, r: 15, t: schmal ? 70 : 40, b: schmal ? 90 : 50 }
    }), cfg);
  })();

  /* ---------- 6) income distribution within each electorate ---------- */
  (function () {
    var blau = ["#e3eef7", "#c6dbef", "#9ecae1", "#6baed6", "#4292c6", "#2171b5", "#08519c", "#08306b"];
    var P = D.parties;
    var traces = E.map(function (e, j) {
      return { type: "bar", name: e, x: P, y: P.map(function (p) { return D.income_by_party[p][j]; }),
        marker: { color: blau[j], line: { color: "white", width: 1 } },
        customdata: P.map(function (p) { return [f1(D.income_by_party[p][j]), tsd(D.n_party[p])]; }),
        hovertemplate: "<b>%{x}</b><br>" + e + ": %{customdata[0]}%<br><span style='font-size:11px'>n = %{customdata[1]}</span><extra></extra>" };
    });
    Plotly.newPlot("afdinc-voters", traces, Object.assign({}, basis, {
      barmode: "stack", bargap: 0.25,
      xaxis: { fixedrange: true, tickfont: { size: schmal ? 10 : 12 }, tickangle: schmal ? -45 : 0 }, yaxis: pAxis(100, 25),
      legend: { orientation: "h", x: 0, y: 1.02, xanchor: "left", yanchor: "bottom", font: { size: 11.5 }, traceorder: "normal" },
      margin: { l: 50, r: 15, t: schmal ? 110 : 70, b: schmal ? 70 : 40 }
    }), cfg);
  })();

  /* ---------- 7) predicted share: AfD vs. Left ---------- */
  (function () {
    var traces = band(E, D.afd_left.AfD, farben.AfD, null, "AfD", true, "<b>AfD</b> · %{x}<br>")
      .concat(band(E, D.afd_left.Left, farben.Left, null, "Left", true, "<b>Left</b> · %{x}<br>"));
    Plotly.newPlot("afdinc-left", traces, Object.assign({}, basis, {
      xaxis: xInc, yaxis: pAxis(25, 5),
      legend: { orientation: "h", x: 0, y: 1.02, xanchor: "left", yanchor: "bottom", font: { size: 12 } },
      margin: { l: 50, r: 15, t: 40, b: schmal ? 90 : 50 }
    }), cfg);
  })();

  /* ---------- 8) low income vs. comparison groups, by party ---------- */
  (function () {
    var P = ["Left", "Greens", "SPD", "BSW", "CDU/CSU", "AfD", "Other"], L = D.contrast_labels;
    var sp = schmal ? 1 : 4, axes = gridAxes(P.length), traces = [], annos = [], shapes = [], lay = {};
    var rows = L.map(function (l, i) { return -i; });
    hoehe("afdinc-contrast-parties", 1700);
    P.forEach(function (p, k) {
      var c = D.contrast_parties[p], ax = axes[k];
      traces.push({ type: "scatter", mode: "markers", xaxis: ax.x, yaxis: ax.y, x: c.est, y: rows, showlegend: false,
        marker: { size: 10, color: "white", line: { color: farben[p], width: 2.5 } },
        error_x: { type: "data", symmetric: false, array: c.hi.map(function (h, i) { return h - c.est[i]; }), arrayminus: c.lo.map(function (l, i) { return c.est[i] - l; }), color: farben[p], thickness: 2, width: 4 },
        customdata: c.est.map(function (v, i) { return [vz(v), vz(c.lo[i]), vz(c.hi[i]), L[i]]; }),
        hovertemplate: "<b>" + p + "</b> · %{customdata[3]}<br>%{customdata[0]} pp<br><span style='font-size:11px'>95% CI: %{customdata[1]} to %{customdata[2]}</span><extra></extra>" });
      shapes.push({ type: "line", xref: ax.x, yref: ax.y + " domain", x0: 0, x1: 0, y0: 0, y1: 1, line: { color: ink3, width: 1, dash: "dot" } });
      annos.push(strip(ax, p));
      lay[ax.xaxis] = ppAxis(-30, 20, 10, { tickfont: { size: 9.5, color: ink2 } });
      lay[ax.yaxis] = { tickvals: rows, ticktext: L.map(function (l) { return wrap(l, 18); }), range: [-L.length + 0.4, 0.6], showgrid: false, zeroline: false, fixedrange: true,
                        showticklabels: k % sp === 0, tickfont: { size: 10.5 }, automargin: true };
    });
    Plotly.newPlot("afdinc-contrast-parties", traces, Object.assign({}, basis, lay, {
      annotations: annos, shapes: shapes,
      grid: { rows: Math.ceil(P.length / sp), columns: sp, pattern: "independent", roworder: "top to bottom", xgap: 0.06, ygap: schmal ? 0.18 : 0.3 },
      margin: { l: 10, r: 15, t: 40, b: 40 }
    }), cfg);
  })();

  /* ---------- 9) education vs. income from one joint model ---------- */
  (function () {
    var axes = gridAxes(2), traces = [], annos = [], lay = {};
    var B = D.education, S = D.slopes;
    var teile = [["School education", B, S.education], ["Monthly net household income", E, S.income]];
    hoehe("afdinc-slopes", 860);
    teile.forEach(function (t, k) {
      var ax = axes[k];
      traces = traces.concat(band(t[1], t[2], farben.AfD, ax, "AfD", false, "%{x}<br>"));
      traces.push({ type: "scatter", mode: "text", x: t[1], y: t[2].hi, xaxis: ax.x, yaxis: ax.y, showlegend: false, hoverinfo: "skip",
        text: t[2].est.map(function (v) { return f1(v, 0) + "%"; }), textposition: "top center", textfont: { size: 11, color: ink } });
      annos.push(strip(ax, t[0]));
      lay[ax.xaxis] = { fixedrange: true, tickangle: -40, tickfont: { size: 10.5 }, showgrid: false };
      lay[ax.yaxis] = pAxis(60, 10, { showticklabels: schmal || k === 0 });
    });
    lay.xaxis.domain = schmal ? [0, 1] : [0, 0.42];
    lay.xaxis2.domain = schmal ? [0, 1] : [0.48, 1];
    Plotly.newPlot("afdinc-slopes", traces, Object.assign({}, basis, lay, {
      annotations: annos,
      grid: { rows: schmal ? 2 : 1, columns: schmal ? 1 : 2, pattern: "independent", roworder: "top to bottom", xgap: 0.06, ygap: 0.4 },
      margin: { l: 50, r: 15, t: 40, b: 130 }
    }), cfg);
  })();
});
</script>
